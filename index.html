<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dezernatsquiz</title>
<style>
  :root { --navy:#1d3b63; --blau:#2c5282; --hell:#e9eef4; --rand:#a8b3c0; --text:#1c2430; --rot:#a32a2a; --gruen:#2d6a3a; --gold:#c9a227; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.45 Verdana, Tahoma, Geneva, sans-serif; color:var(--text); background:#e3e7ec; }
  header { background:linear-gradient(#35629b,var(--navy)); color:#fff; padding:9px 12px; border-bottom:3px solid var(--gold); }
  header b { font-size:17px; letter-spacing:.2px; }
  header small { display:block; font-size:11px; opacity:.85; }
  header span { float:right; font-size:11px; background:rgba(0,0,0,.25); padding:2px 6px; border:1px solid rgba(255,255,255,.3); }
  #pfad { background:#d5dde7; border-bottom:1px solid var(--rand); padding:4px 12px; font-size:12px; color:#33425a; }
  main { max-width:560px; margin:10px auto; padding:0 8px; }
  footer { max-width:560px; margin:0 auto 14px; padding:0 8px; font-size:11px; color:#667; text-align:center; }
  .box { background:#fff; border:1px solid var(--rand); margin-bottom:10px; }
  .box h2 { margin:0; padding:5px 10px; font-size:13px; background:linear-gradient(#f3f6fa,#cfd9e5); border-bottom:1px solid var(--rand); color:var(--navy); }
  .box h2::before { content:'\25AA\00a0'; color:var(--gold); }
  .inh { padding:10px; }
  input[type=text], input[type=password], input[type=number], textarea { width:100%; padding:7px; font:inherit; border:1px solid #6f87a3; background:#fbfcfe; }
  button { font:inherit; padding:7px 13px; border:1px solid #4a5f7a; background:linear-gradient(#ffffff,#d3dce7); color:var(--text); cursor:pointer; border-radius:2px; }
  button:active { background:#bfccdb; }
  button:disabled { color:#888; border-color:#b5bcc6; background:#eef0f3; cursor:default; }
  button.pri { background:linear-gradient(#4f7fb5,var(--navy)); color:#fff; border-color:#13294a; }
  button.pri:disabled { background:#aab6c6; border-color:#8e9bb0; color:#eef; }
  button:focus-visible, input:focus-visible, textarea:focus-visible { outline:2px solid #e08a00; outline-offset:1px; }
  .opt { display:block; width:100%; text-align:left; margin-bottom:6px; }
  .opt.sel { background:linear-gradient(#fff1bf,#f0d37a); border-color:#8a6a00; font-weight:bold; }
  .fehler { color:var(--rot); margin-top:6px; }
  .ok { color:var(--gruen); }
  .timer { float:right; font-weight:bold; }
  .warn { color:var(--rot); }
  .klein { font-size:12px; color:#556; }
  img.bild { max-width:100%; display:block; margin:8px 0; border:1px solid var(--rand); }
  table { border-collapse:collapse; width:100%; }
  td, th { border:1px solid var(--rand); padding:4px 7px; text-align:left; }
  th { background:var(--hell); font-weight:normal; color:var(--navy); }
  .eig { margin-bottom:10px; font-size:12px; }
  .eig th { width:36%; }
  .eig .timer { float:none; }
  .grid button { width:16%; padding:8px 0; margin:1%; }
  .grid button.aktiv { background:linear-gradient(#fff1bf,#f0d37a); border-color:#8a6a00; font-weight:bold; }
  .grid td { border:0; padding:0; }
  .grid th { border:0; background:none; }
</style>
</head>
<body>
<header><span id="status">verbinde …</span><b>Dezernatsquiz</b><small>Dokumentenmanagementsystem · Hochschulverwaltung</small></header>
<div id="pfad">Start</div>
<main id="app"></main>
<footer>Dezernatsquiz DMS · Version 3.2.1 · Alle Angaben ohne Gewähr</footer>

<script>
/* ===== 1. EINSTELLUNGEN ===== */
const API = 'https://script.google.com/macros/s/AKfycbwoyd_TgHiTwHsKHg79_sHVbrgdFrrrvPOaCBg0e0vNEz27lVUEu8Nv9GLdSX57N7-r/exec';   // URL der Apps-Script-Bereitstellung
const RUNDEN = 6, FRAGEN_PRO_RUNDE = 5;

/* ===== 2. FRAGEN (Platzhalter – hier eigene Fragen eintragen) =====
   Schlüssel "Runde-Frage". typ: 'mc' (Auswahl), 'offen' (Text), 'schaetz' (Zahl)
   bild: optionale Bild-URL (z. B. Sciebo-Freigabe-Link mit /download am Ende) */
const EIGENE = {
  '1-1': { typ:'mc',     text:'Welche Buchstabenkombination begegnet man bei einem Spaziergang durch das UHG der Uni Bielefeld? (Multiple Choice).', optionen:['END','DIY','WTF','FYI'], bild:'' },
  '1-2': { typ:'mc',    text:'Wie viele Mitarbeitende arbeiten an der Uni Bielefeld aktuell (dezentral und zentral)? Mehrfachantwort möglich.', optionen:['ca. 10.000', 'ca. 3.500', 'ca. 500', 'rund die Hälfte'], bild: ''},
  '1-3': { typ:'mc',     text:'Wie hieß das X-Gebäude zeitweise während seines Baus? Und wofür stand das Akronym?', optionen:['ENUS','NASA','X-Gbd.','FSB'], bild:'' },
  '1-4': { typ:'offen',  text:'Wofür war die alte Mensa im UHG der Uni Bielefeld bekannt?', bild:'' },
  '1-5': { typ: 'mc',   text:'Schön und/oder Praktisch: Wer oder was ist die Uni-Noppe? ', optionen:['das neue Kondom im Uni-Shop ', 'der gummiartige Bodenbelag im Universitätshauptgebäude', 'das bremsende Material auf der Unterseite von Stoppersocken', 'd) die erhabene Struktur auf Klemmbausteinen wie z.B. Legos'], bild: ''}, // weitere Fragen nach demselben Muster: '2-1': { ... }

  '2-1': { typ:'mc',     text:'Welche Buchstabenkombination begegnet man bei einem Spaziergang durch das UHG der Uni Bielefeld? (Multiple Choice).', optionen:['END','DIY','WTF','FYI'], bild:'' },
  '2-2': { typ:'offen',     text:'Welche Buchstabenkombination begegnet man bei einem Spaziergang durch das UHG der Uni Bielefeld? (Multiple Choice).', optionen:['END','DIY','WTF','FYI'], bild:'' },
  '2-3': { typ:'mc',     text:'Welche Buchstabenkombination begegnet man bei einem Spaziergang durch das UHG der Uni Bielefeld? (Multiple Choice).', optionen:['END','DIY','WTF','FYI'], bild:'' },
  '2-4': { typ:'mc',     text:'Welche Buchstabenkombination begegnet man bei einem Spaziergang durch das UHG der Uni Bielefeld? (Multiple Choice).', optionen:['END','DIY','WTF','FYI'], bild:'' },
  '2-5': { typ:'mc',     text:'Welche Buchstabenkombination begegnet man bei einem Spaziergang durch das UHG der Uni Bielefeld? (Multiple Choice).', optionen:['END','DIY','WTF','FYI'], bild:'' },

  '1-4': { typ:'offen',  text:'Wofür war die alte Mensa im UHG der Uni Bielefeld bekannt?', bild:'' },
  '1-2': { typ:'offen',  text:'Hier steht Frage 1.2 (offene Frage).', bild:'' },
  '1-3': { typ:'schaetz',text:'Hier steht Frage 1.3 (Schätzfrage).', bild:'' },

};
function frage(key) {
  return EIGENE[key] || { typ:'offen', text:'Platzhalter für Frage ' + key.replace('-', '.'), bild:'' };
}

/* ===== 3. Hilfsfunktionen ===== */
const $app = document.getElementById('app'), $st = document.getElementById('status');
const MASTER = location.search.includes('master');
let pw = '', team = localStorage.getItem('team') || '', fehler = '', letzterStand = '';
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const get = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const put = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };

async function post(o) {
  const r = await fetch(API, { method:'POST', body: JSON.stringify(o) });  // text/plain, kein Preflight
  return r.json();
}
async function stand() { const r = await fetch(API); return r.json(); }

/* Timer: Zeitbasis kommt vom Server, daher laufen alle Handys synchron */
let Z = { current:'', locked:false, start:0, dauer:120, off:0 };
function setZ(s) { Z = { current:s.current, locked:s.locked, start:s.start, dauer:s.dauer, off:s.now - Date.now() }; }
function rest() { return Z.current && Z.start ? Math.max(0, Math.ceil((Z.start + Z.dauer * 1000 - (Date.now() + Z.off)) / 1000)) : 0; }
function tt() {
  if (Z.locked) return 'gesperrt';
  const r = rest();
  return r ? Math.floor(r / 60) + ':' + String(r % 60).padStart(2, '0') : 'Zeit abgelaufen';
}

/* ===== 4. Teilnehmer ===== */
async function anmelden() {
  const name = document.getElementById('tn').value.trim();
  let r;
  try { r = await post({ a:'join', team:name }); }
  catch (e) { r = { ok:false, error: API.startsWith('HIER') ? 'Die API-URL ist in index.html noch nicht eingetragen.' : 'Keine Verbindung zum Quiz-Server. Bitte später erneut versuchen.' }; }
  if (r.ok) { team = name; put('team', name); fehler = ''; letzterStand = ''; tick(); }
  else { fehler = r.error; zeigeAnmeldung(); }
}
function pfad(t) { document.getElementById('pfad').textContent = 'Start › ' + t; }
function zeigeAnmeldung() {
  pfad('Anmeldung');
  $app.innerHTML = `<div class="box"><h2>Anmeldung</h2><div class="inh">
    <p>Gebt euren Teamnamen ein. Ein Handy pro Team genügt.</p>
    <input type="text" id="tn" maxlength="30" placeholder="Teamname" autocomplete="off">
    <p><button class="pri" onclick="anmelden()">Anmelden</button></p>
    <div class="fehler">${esc(fehler)}</div></div></div>`;
}
function zeigeFrage(s) {
  const f = frage(s.current), [r, n] = s.current.split('-');
  pfad('Dezernatsquiz › Runde ' + r + ' › Frage ' + n);
  const gesendet = get('ant-' + s.current);
  let eingabe = '';
  if (gesendet !== null) eingabe = `<p class="ok">Antwort abgegeben: <b>${esc(gesendet)}</b></p>`;
  else if (s.locked || rest() === 0) eingabe = `<p class="fehler">Die Antwortzeit ist vorbei. Antworten sind nicht mehr möglich.</p>`;
  else if (f.typ === 'mc') { gewaehlt = ''; eingabe = (f.optionen || []).map(o => `<button class="opt" onclick="waehle(this)" data-v="${esc(o)}">${esc(o)}</button>`).join('')
    + `<p class="klein" id="wahl">Antwort antippen, dann bestätigen. Bis zur Bestätigung könnt ihr noch wechseln.</p>
       <p><button class="pri" id="bestaetigen" disabled onclick="sende(gewaehlt)">Antwort bestätigen</button></p>`; }
  else if (f.typ === 'schaetz') eingabe = `<input type="number" id="ant" inputmode="decimal" placeholder="Eure Schätzung"><p><button class="pri" onclick="sende(document.getElementById('ant').value)">Antwort senden</button></p>`;
  else eingabe = `<textarea id="ant" rows="3" placeholder="Eure Antwort"></textarea><p><button class="pri" onclick="sende(document.getElementById('ant').value)">Antwort senden</button></p>`;
  $app.innerHTML = `<div class="box"><h2>Vorgang bearbeiten</h2><div class="inh">
    <table class="eig"><tr><th>Vorgang</th><td>Runde ${r} von ${RUNDEN}, Frage ${n} von ${FRAGEN_PRO_RUNDE}</td></tr><tr><th>Bearbeitungsfrist</th><td><span class="timer">${tt()}</span></td></tr><tr><th>Sachbearbeitung</th><td>${esc(team)}</td></tr></table>
    <p><b>${esc(f.text)}</b></p>${f.bild ? `<img class="bild" src="${esc(f.bild)}" alt="">` : ''}
    ${eingabe}<div class="fehler" id="fe">${esc(fehler)}</div></div></div>`;
}
function zeigeWarten() {
  pfad('Dezernatsquiz › Wartebereich');
  $app.innerHTML = `<div class="box"><h2>Bitte warten</h2><div class="inh">
    <p>Zurzeit liegt kein Vorgang zur Bearbeitung vor. Die Quizleitung gibt den nächsten Vorgang frei. Diese Seite aktualisiert sich selbst.</p>
    <p class="klein">Team: ${esc(team)}</p></div></div>`;
}
let gewaehlt = '';
function waehle(btn) {
  gewaehlt = btn.dataset.v;
  document.querySelectorAll('.opt').forEach(o => o.classList.toggle('sel', o === btn));
  document.getElementById('wahl').textContent = 'Ausgewählt: ' + gewaehlt;
  const b = document.getElementById('bestaetigen');
  b.disabled = false; b.textContent = 'Antwort bestätigen: ' + gewaehlt;
}
async function sende(v) {
  v = String(v || '').trim();
  if (!v) { fehler = 'Bitte eine Antwort eingeben.'; document.getElementById('fe').textContent = fehler; return; }
  const key = letzterStand.split('|')[0];
  const r = await post({ a:'answer', team, key, answer:v });
  if (r.ok) { put('ant-' + key, v); fehler = ''; } else fehler = r.error;
  letzterStand = ''; tick();
}

/* ===== 5. Quizmaster ===== */
async function master(aktion, key) {
  const r = await post({ a:aktion, pw, key });
  if (!r.ok) { fehler = r.error; pw = ''; return zeigeLogin(); }
  fehler = ''; setZ(r); zeigeMaster(r);
}
function zeigeLogin() {
  pfad('Verwaltung › Anmeldung');
  $app.innerHTML = `<div class="box"><h2>Quizmaster</h2><div class="inh">
    <input type="password" id="pw" placeholder="Passwort">
    <p><button class="pri" onclick="pw=document.getElementById('pw').value;master('status')">Anmelden</button></p>
    <div class="fehler">${esc(fehler)}</div></div></div>`;
}
function zeigeMaster(s) {
  pfad('Verwaltung › Quizleitung');
  let z = '';
  for (let r = 1; r <= RUNDEN; r++) {
    z += `<tr><th>Runde ${r}</th><td>`;
    for (let n = 1; n <= FRAGEN_PRO_RUNDE; n++) {
      const k = r + '-' + n;
      z += `<button class="${k === s.current ? 'aktiv' : ''}" onclick="master('release','${k}')">${n}</button>`;
    }
    z += '</td></tr>';
  }
  const f = s.current ? frage(s.current) : null;
  $app.innerHTML = `<div class="box"><h2>Vorgang freigeben</h2><div class="inh">
    <table class="grid">${z}</table></div></div>
    <div class="box"><h2>Aktuell: ${s.current ? 'Frage ' + s.current.replace('-', '.') + (s.locked ? ' (gesperrt)' : ' (offen)') : 'keine'}<span class="timer">${s.current ? tt() : ''}</span></h2><div class="inh">
    ${f ? `<p>${esc(f.text)}</p>` : ''}
    <p><button onclick="master('${s.locked ? 'unlock' : 'lock'}')" ${s.current ? '' : 'disabled'}>${s.locked ? 'Wieder öffnen' : 'Antworten sperren'}</button>
       <button onclick="master('hide')" ${s.current ? '' : 'disabled'}>Frage ausblenden</button></p></div></div>
    <div class="box"><h2>Teams (${s.teams.length} von 7)</h2><div class="inh"><table>
    ${s.teams.map(t => `<tr><td>${esc(t)}</td><td>${s.answered.includes(t) ? '<span class="ok">hat geantwortet</span>' : '–'}</td></tr>`).join('')}
    </table></div></div>
    <div class="box"><h2>Neues Quiz</h2><div class="inh">
    <button onclick="if (confirm('Wirklich alles zurücksetzen? Alle Teams werden abgemeldet, die Fragen ausgeblendet.')) master('reset')">Alles zurücksetzen</button>
    <p class="klein">Die bisherigen Blätter „Teams“ und „Antworten“ bleiben im Sheet als Archiv mit Datum erhalten.</p></div></div>`;
}

/* ===== 6. Abfrage-Schleife ===== */
async function tick() {
  try {
    if (MASTER) { if (pw) { const r = await post({ a:'status', pw }); if (r.ok) { setZ(r); zeigeMaster(r); } } else if (!$app.innerHTML) zeigeLogin(); }
    else {
      if (!team && !document.getElementById('tn')) zeigeAnmeldung();   // Anmeldung immer zeigen, auch ohne Verbindung
      const s = await stand(); setZ(s);
      if (String(s.epoche) !== get('epoche')) {      // Quizmaster hat zurückgesetzt: lokale Daten löschen
        try { Object.keys(localStorage).filter(k => k === 'team' || k.startsWith('ant-')).forEach(k => localStorage.removeItem(k)); } catch (e) {}
        put('epoche', String(s.epoche)); team = ''; letzterStand = '';
      }
      if (!team) { if (!document.getElementById('tn')) zeigeAnmeldung(); }
      else {
        const sig = s.current + '|' + s.locked + '|' + s.start;
        if (sig !== letzterStand) { letzterStand = sig; s.current ? zeigeFrage(s) : zeigeWarten(); }
      }
    }
    $st.textContent = 'verbunden';
  } catch (e) { $st.textContent = 'keine Verbindung'; }
}
tick(); setInterval(tick, 3000);
let warAb = null;
setInterval(() => {                       // jede Sekunde: Anzeige aktualisieren
  const r = rest(), ab = Z.current && r === 0;
  document.querySelectorAll('.timer').forEach(e => { e.textContent = tt(); e.classList.toggle('warn', r > 0 && r <= 10); });
  if (warAb !== null && ab && !warAb && !MASTER && team) { letzterStand = ''; tick(); }  // Eingabe sperren
  warAb = ab;
}, 1000);
</script>
</body>
</html>
